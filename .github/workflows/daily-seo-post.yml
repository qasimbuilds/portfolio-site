name: Auto-Publish SEO Blog Post

on:
  schedule:
    # Runs at 05:30 UTC (11:00 AM IST) every Monday, Wednesday, and Friday
    # Change to '30 5 * * *' if you strictly want every single day
    - cron: '30 5 * * 1,3,5'
  workflow_dispatch: # Allows you to click "Run workflow" manually anytime to test

permissions:
  contents: write

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate SEO post and update sitemap
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node scripts/generate_post.mjs

      - name: Commit and push new post
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --staged --quiet || git commit -m "chore(seo): publish scheduled blog post"
          git push
